<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Abraham’s Ops Notebook</title>
<style>
  :root {
    --bg: #0B1220;
    --panel: #141B2E;
    --panel-border: #223049;
    --text: #E7ECF3;
    --text-muted: #8D9BB3;
    --accent-link: #53D6BC;
    --accent-note: #F2A541;
    --danger: #E35D5D;
    --radius-sm: 6px;
    --radius-md: 10px;
    --font-sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, sans-serif;
    --font-mono: ui-monospace, SFMono-Regular, Consolas, "Liberation Mono", monospace;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: var(--font-sans);
    line-height: 1.5;
    padding: 2.5rem 1.5rem 4rem;
  }

  .page {
    max-width: 1100px;
    margin: 0 auto;
  }

  .masthead {
    margin-bottom: 2.5rem;
  }

  .masthead h1 {
    font-size: 1.9rem;
    font-weight: 650;
    margin: 0 0 0.4rem;
    letter-spacing: -0.01em;
  }

  .masthead p {
    color: var(--text-muted);
    margin: 0;
    font-size: 0.95rem;
  }

  .layout {
    display: grid;
    grid-template-columns: 280px 1fr;
    gap: 1.75rem;
    align-items: start;
  }

  @media (max-width: 760px) {
    .layout { grid-template-columns: 1fr; }
  }

  .panel {
    background: var(--panel);
    border: 1px solid var(--panel-border);
    border-radius: var(--radius-md);
    padding: 1.25rem;
  }

  .panel h2 {
    font-size: 0.95rem;
    font-weight: 600;
    margin: 0 0 1rem;
    color: var(--text);
  }

  .link-list {
    list-style: none;
    margin: 0;
    padding: 0;
    display: flex;
    flex-direction: column;
    gap: 0.5rem;
  }

  .link-row {
    display: flex;
    flex-direction: column;
    gap: 0.1rem;
    padding: 0.55rem 0.65rem;
    border-radius: var(--radius-sm);
    border: 1px solid transparent;
  }

  .link-row:hover {
    border-color: var(--panel-border);
    background: rgba(255,255,255,0.02);
  }

  .link-row a {
    color: var(--text);
    text-decoration: none;
    font-size: 0.92rem;
    font-weight: 500;
  }

  .link-row a:hover,
  .link-row a:focus-visible {
    color: var(--accent-link);
    text-decoration: underline;
  }

  .link-row .url {
    font-family: var(--font-mono);
    font-size: 0.75rem;
    color: var(--text-muted);
    display: block;
    max-width: 100%;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .ghost-btn {
    width: 100%;
    margin-top: 0.9rem;
    background: transparent;
    border: 1px dashed var(--panel-border);
    color: var(--text-muted);
    border-radius: var(--radius-sm);
    padding: 0.5rem;
    font-size: 0.85rem;
    cursor: pointer;
    font-family: inherit;
  }

  .ghost-btn:hover,
  .ghost-btn:focus-visible {
    border-color: var(--accent-link);
    color: var(--accent-link);
  }

  .notes-toolbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 1rem;
  }

  .notes-toolbar h2 {
    font-size: 1.1rem;
    margin: 0;
  }

  .save-status {
    font-size: 0.8rem;
    color: var(--text-muted);
  }

  .save-status.saving { color: var(--accent-note); }

  details {
    background: var(--panel);
    border: 1px solid var(--panel-border);
    border-radius: var(--radius-md);
    margin-bottom: 0.75rem;
    overflow: hidden;
  }

  summary {
    cursor: pointer;
    padding: 0.85rem 1.1rem;
    font-weight: 600;
    font-size: 0.95rem;
    list-style: none;
    display: flex;
    align-items: center;
    gap: 0.6rem;
  }

  summary::-webkit-details-marker { display: none; }

  summary::before {
    content: "▸";
    color: var(--accent-note);
    font-size: 0.75rem;
    transition: transform 0.15s ease;
  }

  details[open] summary::before {
    transform: rotate(90deg);
  }

  .note-body {
    padding: 0 1.1rem 1.1rem;
    font-size: 0.92rem;
    color: var(--text);
    outline: none;
    min-height: 2.5rem;
    white-space: pre-wrap;
  }

  .note-body:empty::before {
    content: attr(data-placeholder);
    color: var(--text-muted);
  }

  .note-body:focus-visible {
    box-shadow: inset 2px 0 0 var(--accent-note);
  }

  a:focus-visible, button:focus-visible, [contenteditable]:focus-visible {
    outline: 2px solid var(--accent-link);
    outline-offset: 2px;
  }

  @media (prefers-reduced-motion: reduce) {
    * { transition: none !important; }
  }
</style>
</head>
<body>
<div class="page">

  <header class="masthead">
    <h1>Abraham’s Ops Notebook</h1>
    <p>Quick links and running notes, kept in one place.</p>
  </header>

  <main class="layout">

    <aside class="panel">
      <h2>Quick links</h2>
      <ul class="link-list" id="link-list">
        <li class="link-row">
          <a href="https://google.com" target="_blank" rel="noopener">Google</a>
          <span class="url">google.com</span>
        </li>
        <li class="link-row">
          <a href="https://github.com" target="_blank" rel="noopener">GitHub</a>
          <span class="url">github.com</span>
        </li>
      </ul>
      <button class="ghost-btn" id="add-link-btn" type="button">+ Add link</button>
    </aside>

    <section>
      <div class="notes-toolbar">
        <h2>Notes</h2>
        <span class="save-status" id="save-status">All changes saved</span>
      </div>

      <div id="notes-container">
        <details open>
          <summary>Kubernetes &amp; kind cluster</summary>
          <div class="note-body" contenteditable="true" data-note-id="k8s"
               data-placeholder="Click to add notes — cluster config, node setup, troubleshooting steps…"></div>
        </details>

        <details>
          <summary>ArgoCD &amp; GitOps</summary>
          <div class="note-body" contenteditable="true" data-note-id="argocd"
               data-placeholder="Click to add notes — sync policies, repo connections, app manifests…"></div>
        </details>

        <details>
          <summary>General notes</summary>
          <div class="note-body" contenteditable="true" data-note-id="general"
               data-placeholder="Click to start typing…"></div>
        </details>
      </div>

      <button class="ghost-btn" id="add-section-btn" type="button">+ Add section</button>
    </section>

  </main>
</div>

<script>
(function () {
  var STORAGE_PREFIX = "ktnotes_";
  var SECTIONS_KEY = "ktnotes_custom_sections";
  var LINKS_KEY = "ktnotes_custom_links";
  var saveStatus = document.getElementById("save-status");
  var saveTimer = null;

  function markSaving() {
    saveStatus.textContent = "Saving…";
    saveStatus.classList.add("saving");
    clearTimeout(saveTimer);
    saveTimer = setTimeout(function () {
      saveStatus.textContent = "All changes saved";
      saveStatus.classList.remove("saving");
    }, 500);
  }

  function loadNoteBodies() {
    document.querySelectorAll(".note-body[data-note-id]").forEach(function (el) {
      var saved = localStorage.getItem(STORAGE_PREFIX + el.dataset.noteId);
      if (saved !== null) el.textContent = saved;
    });
  }

  function attachNoteListeners(root) {
    root.querySelectorAll(".note-body[data-note-id]").forEach(function (el) {
      el.addEventListener("input", function () {
        localStorage.setItem(STORAGE_PREFIX + el.dataset.noteId, el.textContent);
        markSaving();
      });
    });
  }

  function loadCustomSections() {
    var raw = localStorage.getItem(SECTIONS_KEY);
    if (!raw) return;
    try {
      var sections = JSON.parse(raw);
      var container = document.getElementById("notes-container");
      sections.forEach(function (s) {
        container.appendChild(buildSection(s.id, s.title));
      });
    } catch (e) { /* ignore malformed storage */ }
  }

  function buildSection(id, title) {
    var details = document.createElement("details");
    var summary = document.createElement("summary");
    summary.textContent = title;
    var body = document.createElement("div");
    body.className = "note-body";
    body.contentEditable = "true";
    body.dataset.noteId = id;
    body.dataset.placeholder = "Click to start typing…";
    details.appendChild(summary);
    details.appendChild(body);
    attachNoteListeners(details);
    loadNoteBodies();
    return details;
  }

  document.getElementById("add-section-btn").addEventListener("click", function () {
    var title = prompt("Section title:");
    if (!title) return;
    var id = "custom_" + Date.now();
    document.getElementById("notes-container").appendChild(buildSection(id, title));

    var raw = localStorage.getItem(SECTIONS_KEY);
    var sections = raw ? JSON.parse(raw) : [];
    sections.push({ id: id, title: title });
    localStorage.setItem(SECTIONS_KEY, JSON.stringify(sections));
  });

  function renderCustomLinks() {
    var raw = localStorage.getItem(LINKS_KEY);
    if (!raw) return;
    try {
      var links = JSON.parse(raw);
      var list = document.getElementById("link-list");
      links.forEach(function (l) {
        var li = document.createElement("li");
        li.className = "link-row";
        var a = document.createElement("a");
        a.href = l.url;
        a.target = "_blank";
        a.rel = "noopener";
        a.textContent = l.label;
        var span = document.createElement("span");
        span.className = "url";
        span.textContent = l.url.replace(/^https?:\/\//, "");
        span.title = l.url;
        li.appendChild(a);
        li.appendChild(span);
        list.appendChild(li);
      });
    } catch (e) { /* ignore malformed storage */ }
  }

  document.getElementById("add-link-btn").addEventListener("click", function () {
    var label = prompt("Link name:");
    if (!label) return;
    var url = prompt("URL (include https://):");
    if (!url) return;

    var li = document.createElement("li");
    li.className = "link-row";
    var a = document.createElement("a");
    a.href = url;
    a.target = "_blank";
    a.rel = "noopener";
    a.textContent = label;
    var span = document.createElement("span");
    span.className = "url";
    span.textContent = url.replace(/^https?:\/\//, "");
    span.title = url;
    li.appendChild(a);
    li.appendChild(span);
    document.getElementById("link-list").appendChild(li);

    var raw = localStorage.getItem(LINKS_KEY);
    var links = raw ? JSON.parse(raw) : [];
    links.push({ label: label, url: url });
    localStorage.setItem(LINKS_KEY, JSON.stringify(links));
  });

  attachNoteListeners(document);
  loadCustomSections();
  loadNoteBodies();
  renderCustomLinks();
})();
</script>

</body>
</html>
