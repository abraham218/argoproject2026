<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Abraham’s Ops Notebook</title>
<style>
  :root {
    --bg: #0B1220;
    --panel: #141B2E;
    --panel-border: #223049;
    --text: #E7ECF3;
    --text-muted: #8D9BB3;
    --accent-link: #53D6BC;
    --accent-note: #F2A541;
    --danger: #E35D5D;
    --radius-sm: 6px;
    --radius-md: 10px;
    --font-sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, sans-serif;
    --font-mono: ui-monospace, SFMono-Regular, Consolas, "Liberation Mono", monospace;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: var(--font-sans);
    line-height: 1.5;
    padding: 2.5rem 1.5rem 4rem;
  }

  .page {
    max-width: 1100px;
    margin: 0 auto;
  }

  .masthead {
    margin-bottom: 2.5rem;
  }

  .masthead h1 {
    font-size: 1.9rem;
    font-weight: 650;
    margin: 0 0 0.4rem;
    letter-spacing: -0.01em;
  }

  .masthead p {
    color: var(--text-muted);
    margin: 0;
    font-size: 0.95rem;
  }

  .layout {
    display: grid;
    grid-template-columns: 280px 1fr;
    gap: 1.75rem;
    align-items: start;
  }

  @media (max-width: 760px) {
    .layout { grid-template-columns: 1fr; }
  }

  .panel {
    background: var(--panel);
    border: 1px solid var(--panel-border);
    border-radius: var(--radius-md);
    padding: 1.25rem;
  }

  .panel h2 {
    font-size: 0.95rem;
    font-weight: 600;
    margin: 0 0 1rem;
    color: var(--text);
  }

  .link-list {
    list-style: none;
    margin: 0;
    padding: 0;
    display: flex;
    flex-direction: column;
    gap: 0.5rem;
  }

  .link-row {
    display: flex;
    align-items: center;
    gap: 0.5rem;
    padding: 0.55rem 0.65rem;
    border-radius: var(--radius-sm);
    border: 1px solid transparent;
  }

  .link-row:hover {
    border-color: var(--panel-border);
    background: rgba(255,255,255,0.02);
  }

  .link-row .link-text {
    flex: 1;
    min-width: 0;
    display: flex;
    flex-direction: column;
    gap: 0.1rem;
  }

  .link-row a {
    color: var(--text);
    text-decoration: none;
    font-size: 0.92rem;
    font-weight: 500;
  }

  .link-row a:hover,
  .link-row a:focus-visible {
    color: var(--accent-link);
    text-decoration: underline;
  }

  .link-row .url {
    font-family: var(--font-mono);
    font-size: 0.75rem;
    color: var(--text-muted);
    display: block;
    max-width: 100%;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .remove-btn {
    flex-shrink: 0;
    background: transparent;
    border: none;
    color: var(--text-muted);
    font-size: 1rem;
    line-height: 1;
    cursor: pointer;
    padding: 0.25rem 0.4rem;
    border-radius: var(--radius-sm);
    opacity: 0;
    transition: opacity 0.1s ease, color 0.1s ease;
  }

  .link-row:hover .remove-btn,
  .remove-btn:focus-visible {
    opacity: 1;
  }

  .remove-btn:hover,
  .remove-btn:focus-visible {
    color: var(--danger);
  }

  .ghost-btn {
    width: 100%;
    margin-top: 0.9rem;
    background: transparent;
    border: 1px dashed var(--panel-border);
    color: var(--text-muted);
    border-radius: var(--radius-sm);
    padding: 0.5rem;
    font-size: 0.85rem;
    cursor: pointer;
    font-family: inherit;
  }

  .ghost-btn:hover,
  .ghost-btn:focus-visible {
    border-color: var(--accent-link);
    color: var(--accent-link);
  }

  .todo-toolbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 1rem;
  }

  .todo-toolbar h2 {
    font-size: 1.1rem;
    margin: 0;
  }

  .save-status {
    font-size: 0.8rem;
    color: var(--text-muted);
  }

  .save-status.saving { color: var(--accent-note); }

  .todo-input-row {
    display: flex;
    gap: 0.5rem;
    margin-bottom: 1rem;
  }

  .todo-input-row input {
    flex: 1;
    background: var(--panel);
    border: 1px solid var(--panel-border);
    border-radius: var(--radius-sm);
    color: var(--text);
    padding: 0.6rem 0.8rem;
    font-size: 0.92rem;
    font-family: inherit;
  }

  .todo-input-row input:focus-visible {
    outline: 2px solid var(--accent-link);
    outline-offset: 1px;
  }

  .todo-input-row button {
    background: var(--accent-note);
    border: none;
    color: #1a1406;
    font-weight: 600;
    padding: 0 1.1rem;
    border-radius: var(--radius-sm);
    cursor: pointer;
    font-size: 0.9rem;
  }

  .todo-input-row button:hover,
  .todo-input-row button:focus-visible {
    filter: brightness(1.08);
  }

  .todo-list {
    list-style: none;
    margin: 0;
    padding: 0;
    display: flex;
    flex-direction: column;
    gap: 0.5rem;
  }

  .todo-item {
    display: flex;
    align-items: center;
    gap: 0.75rem;
    background: var(--panel);
    border: 1px solid var(--panel-border);
    border-radius: var(--radius-md);
    padding: 0.75rem 1rem;
  }

  .todo-item input[type="checkbox"] {
    width: 1.1rem;
    height: 1.1rem;
    accent-color: var(--accent-note);
    flex-shrink: 0;
    cursor: pointer;
  }

  .todo-item .todo-text {
    flex: 1;
    font-size: 0.92rem;
    word-break: break-word;
  }

  .todo-item.done .todo-text {
    color: var(--text-muted);
    text-decoration: line-through;
  }

  .todo-empty {
    color: var(--text-muted);
    font-size: 0.88rem;
    padding: 0.5rem 0.2rem;
  }

  a:focus-visible, button:focus-visible, [contenteditable]:focus-visible {
    outline: 2px solid var(--accent-link);
    outline-offset: 2px;
  }

  @media (prefers-reduced-motion: reduce) {
    * { transition: none !important; }
  }
</style>
</head>
<body>
<div class="page">

  <header class="masthead">
    <h1>Abraham’s Ops Notebook</h1>
    <p>Quick links and a running to-do list, kept in one place.</p>
  </header>

  <main class="layout">

    <aside class="panel">
      <h2>Quick links</h2>
      <ul class="link-list" id="link-list">
        <li class="link-row" data-static-key="google">
          <span class="link-text">
            <a href="https://google.com" target="_blank" rel="noopener">Google</a>
            <span class="url">google.com</span>
          </span>
          <button class="remove-btn" type="button" aria-label="Remove Google">×</button>
        </li>
        <li class="link-row" data-static-key="github">
          <span class="link-text">
            <a href="https://github.com" target="_blank" rel="noopener">GitHub</a>
            <span class="url">github.com</span>
          </span>
          <button class="remove-btn" type="button" aria-label="Remove GitHub">×</button>
        </li>
      </ul>
      <button class="ghost-btn" id="add-link-btn" type="button">+ Add link</button>
    </aside>

    <section>
      <div class="todo-toolbar">
        <h2>To-do list</h2>
        <span class="save-status" id="save-status">All changes saved</span>
      </div>

      <div class="todo-input-row">
        <input type="text" id="todo-input" placeholder="Add a task…" aria-label="New task">
        <button id="todo-add-btn" type="button">Add</button>
      </div>

      <ul class="todo-list" id="todo-list"></ul>
    </section>

  </main>
</div>

<script>
(function () {
  var LINKS_KEY = "ktnotes_custom_links";
  var HIDDEN_STATIC_KEY = "ktnotes_hidden_static_links";
  var TODOS_KEY = "ktnotes_todos";

  var saveStatus = document.getElementById("save-status");
  var saveTimer = null;

  function markSaving() {
    saveStatus.textContent = "Saving…";
    saveStatus.classList.add("saving");
    clearTimeout(saveTimer);
    saveTimer = setTimeout(function () {
      saveStatus.textContent = "All changes saved";
      saveStatus.classList.remove("saving");
    }, 500);
  }

  // ---------- Quick links ----------

  function hideStaticLink(key) {
    var raw = localStorage.getItem(HIDDEN_STATIC_KEY);
    var hidden = raw ? JSON.parse(raw) : [];
    if (hidden.indexOf(key) === -1) hidden.push(key);
    localStorage.setItem(HIDDEN_STATIC_KEY, JSON.stringify(hidden));
  }

  function applyHiddenStaticLinks() {
    var raw = localStorage.getItem(HIDDEN_STATIC_KEY);
    if (!raw) return;
    try {
      var hidden = JSON.parse(raw);
      hidden.forEach(function (key) {
        var li = document.querySelector('.link-row[data-static-key="' + key + '"]');
        if (li) li.remove();
      });
    } catch (e) { /* ignore malformed storage */ }
  }

  function wireStaticRemoveButtons() {
    document.querySelectorAll('.link-row[data-static-key] .remove-btn').forEach(function (btn) {
      btn.addEventListener("click", function () {
        var li = btn.closest(".link-row");
        var key = li.dataset.staticKey;
        li.remove();
        hideStaticLink(key);
        markSaving();
      });
    });
  }

  function removeCustomLink(id) {
    var raw = localStorage.getItem(LINKS_KEY);
    if (!raw) return;
    var links = JSON.parse(raw).filter(function (l) { return l.id !== id; });
    localStorage.setItem(LINKS_KEY, JSON.stringify(links));
  }

  function buildLinkRow(id, label, url) {
    var li = document.createElement("li");
    li.className = "link-row";

    var textWrap = document.createElement("span");
    textWrap.className = "link-text";

    var a = document.createElement("a");
    a.href = url;
    a.target = "_blank";
    a.rel = "noopener";
    a.textContent = label;

    var span = document.createElement("span");
    span.className = "url";
    span.textContent = url.replace(/^https?:\/\//, "");
    span.title = url;

    textWrap.appendChild(a);
    textWrap.appendChild(span);

    var removeBtn = document.createElement("button");
    removeBtn.className = "remove-btn";
    removeBtn.type = "button";
    removeBtn.setAttribute("aria-label", "Remove " + label);
    removeBtn.textContent = "×";
    removeBtn.addEventListener("click", function () {
      li.remove();
      removeCustomLink(id);
      markSaving();
    });

    li.appendChild(textWrap);
    li.appendChild(removeBtn);
    return li;
  }

  function renderCustomLinks() {
    var raw = localStorage.getItem(LINKS_KEY);
    if (!raw) return;
    try {
      var links = JSON.parse(raw);
      var list = document.getElementById("link-list");
      links.forEach(function (l) {
        list.appendChild(buildLinkRow(l.id, l.label, l.url));
      });
    } catch (e) { /* ignore malformed storage */ }
  }

  document.getElementById("add-link-btn").addEventListener("click", function () {
    var label = prompt("Link name:");
    if (!label) return;
    var url = prompt("URL (include https://):");
    if (!url) return;

    var id = "link_" + Date.now();
    document.getElementById("link-list").appendChild(buildLinkRow(id, label, url));

    var raw = localStorage.getItem(LINKS_KEY);
    var links = raw ? JSON.parse(raw) : [];
    links.push({ id: id, label: label, url: url });
    localStorage.setItem(LINKS_KEY, JSON.stringify(links));
    markSaving();
  });

  // ---------- To-do list ----------

  var todoList = document.getElementById("todo-list");

  function loadTodos() {
    var raw = localStorage.getItem(TODOS_KEY);
    return raw ? JSON.parse(raw) : [];
  }

  function saveTodos(todos) {
    localStorage.setItem(TODOS_KEY, JSON.stringify(todos));
    markSaving();
  }

  function renderTodos() {
    var todos = loadTodos();
    todoList.innerHTML = "";

    if (todos.length === 0) {
      var empty = document.createElement("li");
      empty.className = "todo-empty";
      empty.textContent = "No tasks yet — add one above.";
      todoList.appendChild(empty);
      return;
    }

    todos.forEach(function (t) {
      var li = document.createElement("li");
      li.className = "todo-item" + (t.done ? " done" : "");

      var checkbox = document.createElement("input");
      checkbox.type = "checkbox";
      checkbox.checked = t.done;
      checkbox.setAttribute("aria-label", "Mark task done");
      checkbox.addEventListener("change", function () {
        var all = loadTodos();
        var item = all.find(function (x) { return x.id === t.id; });
        if (item) item.done = checkbox.checked;
        saveTodos(all);
        renderTodos();
      });

      var text = document.createElement("span");
      text.className = "todo-text";
      text.textContent = t.text;

      var removeBtn = document.createElement("button");
      removeBtn.className = "remove-btn";
      removeBtn.type = "button";
      removeBtn.setAttribute("aria-label", "Remove task");
      removeBtn.textContent = "×";
      removeBtn.style.opacity = "1";
      removeBtn.addEventListener("click", function () {
        var all = loadTodos().filter(function (x) { return x.id !== t.id; });
        saveTodos(all);
        renderTodos();
      });

      li.appendChild(checkbox);
      li.appendChild(text);
      li.appendChild(removeBtn);
      todoList.appendChild(li);
    });
  }

  function addTodo(text) {
    var todos = loadTodos();
    todos.push({ id: "todo_" + Date.now(), text: text, done: false });
    saveTodos(todos);
    renderTodos();
  }

  var todoInput = document.getElementById("todo-input");
  document.getElementById("todo-add-btn").addEventListener("click", function () {
    var val = todoInput.value.trim();
    if (!val) return;
    addTodo(val);
    todoInput.value = "";
    todoInput.focus();
  });

  todoInput.addEventListener("keydown", function (e) {
    if (e.key === "Enter") {
      e.preventDefault();
      document.getElementById("todo-add-btn").click();
    }
  });

  // ---------- Init ----------
  applyHiddenStaticLinks();
  wireStaticRemoveButtons();
  renderCustomLinks();
  renderTodos();
})();
</script>

</body>
</html>
