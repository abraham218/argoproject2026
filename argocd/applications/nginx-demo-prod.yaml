apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: nginx-demo-prod
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default

  source:
    # TODO: replace with your Git repo URL after you push this project
    repoURL: https://github.com/<your-username>/argocd-practice-gitops.git
    targetRevision: main
    path: apps/nginx-demo/overlays/prod

  destination:
    server: https://kubernetes.default.svc
    namespace: nginx-demo-prod

  syncPolicy:
    # Prod intentionally left as manual sync for practice:
    # promote dev -> prod by syncing this Application yourself in the UI/CLI
    syncOptions:
      - CreateNamespace=true
